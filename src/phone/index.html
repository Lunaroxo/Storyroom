<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181c">
  <title>Storyroom</title>
  <link rel="stylesheet" href="app/phone.css">
</head>
<body>
  <header id="top"><b id="showTitle">Storyroom</b><span id="status"></span></header>
  <main id="view"></main>
  <div id="player" class="off"><button type="button" id="playBtn" aria-label="Play or pause">II</button><span id="playTitle"></span><button type="button" id="playClose" aria-label="Close player">x</button></div>
  <nav id="tabs" aria-label="Sections">
    <button type="button" data-tab="record" class="on">Record</button>
    <button type="button" data-tab="script">Script</button>
    <button type="button" data-tab="pages">Pages</button>
    <button type="button" data-tab="library">Library</button>
  </nav>
  <script src="app/shared.js"></script>
  <script src="app/phone.js"></script>
</body>
</html>
